name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    env:
      # Prisma needs the variable present to generate a client. Nothing
      # connects to a database during a build.
      DATABASE_URL: "file:./prisma/ci.db"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Verify migrations apply to an empty database
        run: npx prisma migrate deploy

      - name: Build
        run: npx next build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — publishing is the release workflow's job. This is what
      # catches a Dockerfile that no longer matches the app.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: activitycampaigntracker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name tracker \
            -e APP_SECRET=ci-only-secret-value-not-real \
            -e SEED_ON_START=true \
            -p 3000:3000 activitycampaigntracker:ci

          # Give migrations, seeding and the server time to come up.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/sign-in > /dev/null; then
              echo "Container is serving."
              exit 0
            fi
            sleep 2
          done

          echo "Container failed to serve within 60s:"
          docker logs tracker
          exit 1

      - name: Container logs
        if: always()
        run: docker logs tracker || true
